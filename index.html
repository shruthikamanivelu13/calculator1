<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simple Calculator</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center">

<div class="bg-slate-800 rounded-2xl p-5 w-80 max-w-[90vw] shadow-2xl">

  <div id="display" class="bg-black text-white text-right text-3xl rounded-xl px-4 py-5 mb-4 overflow-x-auto whitespace-nowrap">0</div>

  <div class="grid grid-cols-4 gap-2.5">
    <button onclick="clearDisplay()" class="py-4 rounded-xl bg-red-600 hover:bg-red-500 text-white font-medium transition">C</button>
    <button onclick="deleteLast()" class="py-4 rounded-xl bg-slate-600 hover:bg-slate-500 text-white font-medium transition">⌫</button>
    <button onclick="appendValue('%')" class="py-4 rounded-xl bg-orange-500 hover:bg-orange-400 text-white font-medium transition">%</button>
    <button onclick="appendValue('/')" class="py-4 rounded-xl bg-orange-500 hover:bg-orange-400 text-white font-medium transition">÷</button>

    <button onclick="appendValue('7')" class="py-4 rounded-xl bg-slate-600 hover:bg-slate-500 text-white font-medium transition">7</button>
    <button onclick="appendValue('8')" class="py-4 rounded-xl bg-slate-600 hover:bg-slate-500 text-white font-medium transition">8</button>
    <button onclick="appendValue('9')" class="py-4 rounded-xl bg-slate-600 hover:bg-slate-500 text-white font-medium transition">9</button>
    <button onclick="appendValue('*')" class="py-4 rounded-xl bg-orange-500 hover:bg-orange-400 text-white font-medium transition">×</button>

    <button onclick="appendValue('4')" class="py-4 rounded-xl bg-slate-600 hover:bg-slate-500 text-white font-medium transition">4</button>
    <button onclick="appendValue('5')" class="py-4 rounded-xl bg-slate-600 hover:bg-slate-500 text-white font-medium transition">5</button>
    <button onclick="appendValue('6')" class="py-4 rounded-xl bg-slate-600 hover:bg-slate-500 text-white font-medium transition">6</button>
    <button onclick="appendValue('-')" class="py-4 rounded-xl bg-orange-500 hover:bg-orange-400 text-white font-medium transition">−</button>

    <button onclick="appendValue('1')" class="py-4 rounded-xl bg-slate-600 hover:bg-slate-500 text-white font-medium transition">1</button>
    <button onclick="appendValue('2')" class="py-4 rounded-xl bg-slate-600 hover:bg-slate-500 text-white font-medium transition">2</button>
    <button onclick="appendValue('3')" class="py-4 rounded-xl bg-slate-600 hover:bg-slate-500 text-white font-medium transition">3</button>
    <button onclick="appendValue('+')" class="py-4 rounded-xl bg-orange-500 hover:bg-orange-400 text-white font-medium transition">+</button>

    <button onclick="appendValue('0')" class="py-4 rounded-xl bg-slate-600 hover:bg-slate-500 text-white font-medium transition">0</button>
    <button onclick="appendValue('.')" class="py-4 rounded-xl bg-slate-600 hover:bg-slate-500 text-white font-medium transition">.</button>
    <button onclick="calculate()" class="py-4 rounded-xl bg-green-600 hover:bg-green-500 text-white font-medium transition col-span-2">=</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
